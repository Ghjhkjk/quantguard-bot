name: QuantGuard AI 24/7 Autonomous Bot

on:
  schedule:
    # 每 5 分鐘自動喚醒執行一次，24 小時永不停止
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點按鈕立即執行

permissions:
  contents: write    # 允許機器人將最新的 live_data.json 寫回倉庫

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 🐍 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝量化交易與 AI 套件
        run: |
          pip install ccxt google-genai feedparser

      - name: 🚀 執行兩半資金池多訂單交易引擎
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_bot.py

      - name: 💾 自動將最新 live_data.json 存回 GitHub 供網站實時顯示
        run: |
          git config --local user.email "bot@quantguard.ai"
          git config --local user.name "QuantGuard AutoBot"
          git add live_data.json
          git diff --staged --quiet || git commit -m "Auto-sync OKX live_data.json"
          git push
