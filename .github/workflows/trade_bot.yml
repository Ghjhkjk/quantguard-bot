name: QuantGuard 24/7 Auto Trading

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘自動觸發一次
  workflow_dispatch:        # 支援手動點擊 Run workflow 立即執行

# 🌟 核心防撞車鎖：確保同一時間只有 1 個排程在運行，上一輪跑完才會接下一輪，絕不卡死！
concurrency:
  group: quantguard-live-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt feedparser google-genai

      - name: Run QuantGuard AutoBot v10.8
        env:
          GITHUB_ACTIONS: "true"
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_JOB_RUNTIME_SEC: "210"
        run: |
          python auto_bot.py
          
