name: QuantGuard AI 24/7 Autonomous Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: quantguard-live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 🐍 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝量化交易與 AI 套件
        run: |
          pip install ccxt google-genai feedparser

      - name: 🚀 執行 80/10/10 快慢雙軌量化引擎 (每 20 秒高速巡檢)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_JOB_RUNTIME_SEC: "240"
        run: |
          python auto_bot.py

      - name: 💾 自動將最新 live_data.json 存回 GitHub 供網站實時顯示
        run: |
          git config --local user.email "bot@quantguard.ai"
          git config --local user.name "QuantGuard AutoBot"
          git add live_data.json
          git diff --staged --quiet || (git commit -m "Auto-sync OKX live_data.json v9.0" && git pull --rebase origin main && git push origin main)
